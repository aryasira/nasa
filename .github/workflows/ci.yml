# AI-ASSISTED: drafted with Claude (Anthropic), reviewed by the human team. Owner: Agent C.
name: ci
on:
  push:
    branches: [main, "a/**", "b/**", "c/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy pyyaml jsonschema referencing pytest
      - run: python tools/build_sites.py
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        if: hashFiles('app/package.json') != ''
        with: { node-version: "22" }
      - name: Build app
        if: hashFiles('app/package.json') != ''
        working-directory: app
        run: |
          npm ci || npm install
          npm test --if-present
          npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && hashFiles('app/package.json') != ''
        with: { path: app/dist }
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
        continue-on-error: true
